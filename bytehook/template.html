<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:T;font-weight:800;src:url(../fonts/tajawal-latin-800-normal.woff2)}
@font-face{font-family:T;font-weight:700;src:url(../fonts/tajawal-latin-700-normal.woff2)}
@font-face{font-family:T;font-weight:500;src:url(../fonts/tajawal-latin-500-normal.woff2)}
:root{--bg:#080c18;--cy:#00e5ff;--gr:#39ff88;--wh:#f0f8ff;--red:#ff3b5c;--mute:#8aa0c0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:var(--bg);overflow:hidden;font-family:T,sans-serif;color:var(--wh)}
#bg{position:absolute;inset:0;background-image:linear-gradient(#13203a 1px,transparent 1px),linear-gradient(90deg,#13203a 1px,transparent 1px);background-size:60px 60px}
#rain{position:absolute;inset:0;font:700 34px "DejaVu Sans Mono",monospace;color:rgba(0,229,255,.13);white-space:pre;line-height:44px;overflow:hidden}
#bar{position:absolute;top:0;left:0;height:14px;background:linear-gradient(90deg,var(--cy),var(--gr));box-shadow:0 0 20px var(--cy)}
#brand{position:absolute;top:60px;left:60px;font:700 34px "DejaVu Sans Mono",monospace;color:var(--gr);letter-spacing:2px}
#tag{position:absolute;top:56px;right:60px;font:700 30px "DejaVu Sans Mono",monospace;color:var(--bg);background:var(--cy);padding:8px 18px;border-radius:8px}
.scene{position:absolute;left:70px;right:70px;opacity:0}
#hook{top:560px;text-align:center}
#hook h1{font-weight:800;font-size:104px;line-height:1.08;text-shadow:0 0 30px rgba(0,229,255,.45)}
#hook h1 em{font-style:normal;color:var(--red);text-shadow:0 0 30px rgba(255,59,92,.6)}
#hook p{margin-top:40px;font-weight:700;font-size:56px;color:var(--cy)}
#pts{top:480px}
#pts h2{font-weight:800;font-size:64px;color:var(--cy);margin-bottom:40px}
.pt{display:flex;gap:30px;align-items:flex-start;margin-bottom:46px;opacity:0}
.pt b{flex:none;width:110px;height:110px;border-radius:20px;border:5px solid var(--gr);color:var(--gr);font:800 64px T;display:flex;align-items:center;justify-content:center;box-shadow:0 0 24px rgba(57,255,136,.35)}
.pt div h3{font-weight:800;font-size:64px;line-height:1.05}
.pt div p{font-weight:500;font-size:46px;line-height:1.25;color:#c9d6ee;margin-top:8px}
#fix{top:520px;text-align:center}
#fix .lbl{display:inline-block;font:700 44px "DejaVu Sans Mono",monospace;color:var(--bg);background:var(--gr);padding:10px 28px;border-radius:10px;box-shadow:0 0 30px var(--gr)}
#fix h2{margin-top:50px;font-weight:800;font-size:84px;line-height:1.1}
#fix p{margin-top:36px;font-weight:500;font-size:50px;line-height:1.3;color:#c9d6ee}
#cta{top:700px;text-align:center}
#cta h2{font-weight:800;font-size:92px;line-height:1.1}
#cta h2 span{color:var(--gr)}
#cta p{margin-top:40px;font:700 46px "DejaVu Sans Mono",monospace;color:var(--cy)}
#q{position:absolute;bottom:240px;left:70px;right:70px;text-align:center;font-weight:700;font-size:48px;color:var(--wh);opacity:0}
#q span{color:var(--gr)}
</style></head><body>
<div id="bg"></div><div id="rain"></div><div id="bar"></div>
<div id="brand">&lt;/&gt; BYTE HOOK</div><div id="tag"></div>
<section class="scene" id="hook"><h1></h1><p></p></section>
<section class="scene" id="pts"><h2></h2><div id="list"></div></section>
<section class="scene" id="fix"><span class="lbl"></span><h2></h2><p></p></section>
<section class="scene" id="cta"><h2>Follow for a<br><span>tech hook</span><br>every day</h2><p>@ByteHookShorts</p></section>
<div id="q"></div>
<script>
let D=null,T={};
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
function rain(){let s="";let r=42;const rnd=()=>{r=(r*16807)%2147483647;return r/2147483647};
 for(let y=0;y<44;y++){let l="";for(let x=0;x<52;x++)l+=rnd()<.18?(rnd()<.5?"0":"1"):" ";s+=l+"\n"}$("rain").textContent=s}
function setData(d){D=d;rain();
 $("tag").textContent=d.tag;
 $("hook").querySelector("h1").innerHTML=d.hook;
 $("hook").querySelector("p").textContent=d.sub;
 $("pts").querySelector("h2").textContent=d.points_title;
 $("list").innerHTML=d.points.map((p,i)=>`<div class="pt"><b>${i+1}</b><div><h3>${p.t}</h3><p>${p.d}</p></div></div>`).join("");
 $("fix").querySelector(".lbl").textContent=d.fix_label||"THE FIX";
 $("fix").querySelector("h2").innerHTML=d.fix;
 $("fix").querySelector("p").textContent=d.fix_sub||"";
 $("q").innerHTML=d.question||"";
 const n=d.points.length, step=d.step||3.2;
 T={hook:[0,3.0],pts:[3.0,3.0+n*step+0.8],step};
 T.fix=[T.pts[1],T.pts[1]+5.0];T.cta=[T.fix[1],T.fix[1]+3.5];T.dur=T.cta[1];
 window.DUR=T.dur;
}
function show(el,t,[a,b]){const fi=ease((t-a)/.35),fo=ease((b-t)/.3);const v=t>=a&&t<b?Math.min(fi,fo):0;
 el.style.opacity=v;el.style.transform=`translateY(${(1-fi)*40}px) scale(${.96+.04*fi})`}
function renderAt(t){
 $("bar").style.width=(clamp(t/T.dur)*1080)+"px";
 $("rain").style.transform=`translateY(${-(t*40)%44}px)`;
 show($("hook"),t,T.hook);
 const h1=$("hook").querySelector("h1");const pulse=1+.03*Math.sin(t*9)*(t<T.hook[1]?1:0);h1.style.transform=`scale(${pulse})`;
 show($("pts"),t,T.pts);
 document.querySelectorAll(".pt").forEach((e,i)=>{const s=T.pts[0]+.3+i*T.step;const v=ease((t-s)/.35);e.style.opacity=v;e.style.transform=`translateX(${(1-v)*-60}px)`});
 show($("fix"),t,T.fix);show($("cta"),t,T.cta);
 const q=$("q");const qa=T.fix[0]+1.2;q.style.opacity=t>=qa&&t<T.cta[0]?ease((t-qa)/.4):0;
}
</script></body></html>
